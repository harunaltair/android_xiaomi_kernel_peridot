name: Build Mutan Kernel A16 Extreme (Poco F6)

on:
  push:
    branches: [ 16.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git zip curl \
          libssl-dev libncurses-dev libelf-dev pahole

      # ✅ Clang stabil (AOSP style)
      - name: Setup Clang 17
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          echo "$(pwd)/clang/clang-r498229/bin" >> $GITHUB_PATH

      - name: Build Kernel (GKI + Peridot)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="harun"
          export KBUILD_BUILD_HOST="mutan-builder"

          # 1. Base GKI config
          make O=out gki_defconfig

          # 2. Merge vendor config (WAJIB)
          scripts/kconfig/merge_config.sh -O out \
          out/.config \
          arch/arm64/configs/consolidate.fragment \
          arch/arm64/configs/vendor/peridot_GKI.config

          # Optional Qualcomm base
          if [ -f arch/arm64/configs/db845c_gki.fragment ]; then
            scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/db845c_gki.fragment
          fi

          # 3. Sync config
          make O=out olddefconfig

          # 4. Versioning (aman)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Mutan-Extreme-A16"/g' out/.config

          # 5. Build
          make -j$(nproc) O=out \
              LLVM=1 \
              LLVM_IAS=1 \
              CC=clang \
              Image.gz dtbs 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master
          cd AnyKernel3

          sed -i 's/kernel.string=.*/kernel.string=Mutan-Kernel-A16-Extreme (Poco F6)/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh

          cp ../out/arch/arm64/boot/Image.gz .

          # dtbo handling
          if [ -f "../out/arch/arm64/boot/dtbo.img" ]; then
              cp ../out/arch/arm64/boot/dtbo.img .
          fi

          # dtb
          find ../out/arch/arm64/boot/ -name "*.dtb" -exec cp {} . \;

          zip -r9 ../Mutan-Kernel-Peridot-Extreme.zip *

      - name: Upload Artifact (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Mutan-Kernel-A16-Extreme (Poco F6)
          body: |
            Mutan Kernel A16 Extreme
            - Base: crDroid GKI + peridot config
            - Clang: 17 (stable)
          files: "*.zip"
